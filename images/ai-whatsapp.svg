,Arial,sans-serif" font-size="18" font-weight="600" fill="#1c1b19" text-anchor="start">Ответ в WhatsApp ночью</text><rect x="656" y="346" width="720" height="16" rx="8" fill="#eceae5"/><rect x="656" y="346" width="590.4" height="16" rx="8" fill="#2f62d8"/><text x="656" y="426" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1c1b19" text-anchor="start">Повторные продажи</text><rect x="656" y="442" width="720" height="16" rx="8" fill="#eceae5"/><rect x="656" y="442" width="396.00000000000006" height="16" rx="8" fill="#2f62d8"/><text x="656" y="522" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1c1b19" text-anchor="start">Отчёты руками</text><rect x="656" y="538" width="720" height="16" rx="8" fill="#eceae5"/><rect x="656" y="538" width="460.8" height="16" rx="8" fill="#2f62d8"/><text x="656" y="618" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1c1b19" text-anchor="start">Документы и сметы</text><rect x="656" y="634" width="720" height="16" rx="8" fill="#eceae5"/><rect x="656" y="634" width="273.6" height="16" rx="8" fill="#2f62d8"/></svg>